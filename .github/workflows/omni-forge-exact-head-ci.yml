name: OMNI-FORGE Exact-Head CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/omni-forge-exact-head-ci.yml'
      - 'docs/architecture/**'
      - 'schemas/omni_forge/**'
      - 'src/omni_forge/**'
      - 'tests/omni_forge/**'

permissions:
  contents: read

concurrency:
  group: omni-forge-exact-head-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-exact-head:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind requested head and tested tree
        id: revision
        shell: bash
        env:
          REQUESTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          observed_sha="$(git rev-parse HEAD)"
          tested_tree_sha="$(git rev-parse 'HEAD^{tree}')"
          if [[ "$observed_sha" != "$REQUESTED_HEAD_SHA" ]]; then
            echo "Exact-head mismatch: requested=$REQUESTED_HEAD_SHA observed=$observed_sha" >&2
            exit 1
          fi
          echo "requested_head_sha=$REQUESTED_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "observed_head_sha=$observed_sha" >> "$GITHUB_OUTPUT"
          echo "tested_tree_sha=$tested_tree_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false

      - name: Install and verify dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests

      - name: Validate OMNI-FORGE JSON schemas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for

          files = sorted(Path('schemas/omni_forge').glob('*.json'))
          if not files:
              raise SystemExit('No OMNI-FORGE schemas found')
          for path in files:
              schema = json.loads(path.read_text(encoding='utf-8'))
              validator = validator_for(schema)
              validator.check_schema(schema)
              print(f'validated {path}')
          PY

      - name: Run OMNI-FORGE adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/omni_forge

      - name: Run complete repository tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Run fail-closed redaction scan
        shell: bash
        run: |
          set -euo pipefail
          python -m src.security.redaction_scanner

      - name: Execute canonical validation runner on exact head
        shell: bash
        env:
          REQUESTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_TREE_SHA: ${{ steps.revision.outputs.tested_tree_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/omni-forge-exact-head-results"
          python scripts/run_exact_sha_ci_contract.py \
            --contract config/exact_sha_ci_validation_contract.json \
            --project-root . \
            --results-dir "$RUNNER_TEMP/omni-forge-exact-head-results" \
            --repository-revision "$REQUESTED_HEAD_SHA" \
            --tested-tree-sha "$TESTED_TREE_SHA" \
            --broker-revision "$REQUESTED_HEAD_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-id "$GITHUB_RUN_ID"

      - name: Write exact-head binding receipt
        shell: bash
        env:
          REQUESTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OBSERVED_HEAD_SHA: ${{ steps.revision.outputs.observed_head_sha }}
          TESTED_TREE_SHA: ${{ steps.revision.outputs.tested_tree_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path(os.environ['RUNNER_TEMP']) / 'omni-forge-exact-head-results'
          out.mkdir(parents=True, exist_ok=True)
          receipt = {
              'schema_version': 'aigc.omni-forge-exact-head-ci.v1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'pull_request': int(os.environ['GITHUB_REF'].split('/')[2]),
              'event': os.environ['GITHUB_EVENT_NAME'],
              'requested_head_sha': os.environ['REQUESTED_HEAD_SHA'],
              'observed_head_sha': os.environ['OBSERVED_HEAD_SHA'],
              'tested_tree_sha': os.environ['TESTED_TREE_SHA'],
              'run_number': int(os.environ['GITHUB_RUN_NUMBER']),
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'external_authority_granted': False,
              'merge_authority_granted': False,
              'deployment_authority_granted': False,
              'live_model_call_authority_granted': False,
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          receipt['receipt_sha256'] = hashlib.sha256(canonical).hexdigest()
          (out / 'omni_forge_exact_head_receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload exact-head validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omni-forge-exact-head-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/omni-forge-exact-head-results
          if-no-files-found: error
          compression-level: 6
          overwrite: false
          include-hidden-files: false
