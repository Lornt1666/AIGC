name: AIGC Narration Trigger

on:
  workflow_dispatch:
    inputs:
      narration:
        description: "Narration text that should contain the AIGC trigger phrase."
        required: true
        default: "AIGC"
      project_profile:
        description: "Project profile for cognitive routing."
        required: false
        default: "auto"
      run_mode:
        description: "Routing mode."
        required: false
        default: "artifact_generation"
      submission_decision:
        description: "Submission cockpit decision: review_only, proceed, or deny."
        required: false
        default: "review_only"
      submission_phrase:
        description: "Exact approval phrase for proceed or deny. Leave blank for review_only."
        required: false
        default: ""
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  constellation-fabric:
    name: AIGC pipeline
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'AIGC'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve AIGC trigger parameters
        run: |
          cat > aigc_trigger.env <<'EOF'
          AIGC_TRIGGER_TEXT=${{ github.event.inputs.narration || github.event.comment.body || 'AIGC manual trigger' }}
          AIGC_PROJECT_PROFILE=${{ github.event.inputs.project_profile || 'auto' }}
          AIGC_RUN_MODE=${{ github.event.inputs.run_mode || 'artifact_generation' }}
          AIGC_SUBMISSION_DECISION=${{ github.event.inputs.submission_decision || 'review_only' }}
          AIGC_SUBMISSION_PHRASE=${{ github.event.inputs.submission_phrase || '' }}
          EOF

      - name: Run Phase 1 router
        run: |
          set -a
          . ./aigc_trigger.env
          set +a
          python src/phase1_cognitive_phase_router.py --project-root . --config config/aigc_cognitive_phase_router.json --trigger-text "$AIGC_TRIGGER_TEXT" --project-profile "$AIGC_PROJECT_PROFILE" --run-mode "$AIGC_RUN_MODE"

      - name: Run Phase 2-24 bridge
        run: |
          python src/phase2_24_continuity_bridge.py --project-root . --config config/aigc_phase2_24_continuity.json

      - name: Run phase interleave scheduler
        run: |
          python src/phase_interleave_scheduler.py --project-root . --config config/aigc_phase_interleave_scheduler.json

      - name: Run Google Workspace Secret Manager procurement
        run: |
          python src/google_workspace_secret_manager_procurement.py --project-root . --config config/aigc_google_workspace_secret_manager_procurement.json

      - name: Run procurement packet
        run: |
          python src/mvp_plus_plus_plus_procurement.py --project-root . --config config/mvp_plus_plus_plus_capability_procurement.json

      - name: Run access automation procurement
        run: |
          python src/access_automation_procurement.py --project-root . --config config/aigc_access_automation_procurement.json

      - name: Run work source gate procurement
        run: |
          python src/work_source_gate_procurement.py --project-root . --config config/aigc_work_source_gate_catalog.json

      - name: Run auto-approval gates
        run: |
          python src/auto_approval_gate_procurement.py --project-root . --config config/aigc_auto_approval_gates.json

      - name: Run Phase 25 classifier
        run: |
          set -a
          . ./aigc_trigger.env
          set +a
          python src/phase25_constellation_fabric.py --project-root . --config config/phase25_constellation_fabric.json --trigger-text "$AIGC_TRIGGER_TEXT"

      - name: Run Phase 26 planner
        run: |
          python src/phase26_constellation_refactor.py --project-root . --config config/phase26_constellation_refactor.json

      - name: Run employer deliverable procurement
        run: |
          python src/employer_deliverable_procurement.py --project-root . --config config/aigc_employer_deliverable_procurement.json

      - name: Run submission approval cockpit
        run: |
          set -a
          . ./aigc_trigger.env
          set +a
          python src/submission_approval_cockpit.py --project-root . --config config/aigc_submission_approval_cockpit.json --decision "$AIGC_SUBMISSION_DECISION" --phrase "$AIGC_SUBMISSION_PHRASE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aigc-pipeline-artifacts
          if-no-files-found: error
          path: |
            data/phase1_cognitive_router/aigc_phase1_cognitive_plan.json
            data/phase2_24_continuity/aigc_phase2_24_continuity_plan.json
            data/phase_interleaves/aigc_phase_interleave_schedule.json
            data/google_workspace_secret_manager/aigc_google_workspace_secret_manager_procurement_packet.json
            data/mvp_plus_plus_plus/aigc_mvp_plus_plus_plus_procurement_packet.json
            data/access_automation/aigc_access_automation_procurement_packet.json
            data/work_source_gates/aigc_work_source_gate_procurement_packet.json
            data/auto_approval_gates/aigc_auto_approval_gate_packet.json
            data/phase25_constellation/aigc_phase25_constellation_manifest.json
            data/phase26_constellation_refactor/aigc_phase26_refactor_plan.json
            data/employer_deliverables/aigc_employer_deliverable_procurement_packet.json
            data/submission_approval/aigc_submission_approval_decision.json
            data/audit/aigc_phase1_cognitive_router_audit.jsonl
            data/audit/aigc_phase2_24_continuity_audit.jsonl
            data/audit/aigc_phase_interleave_scheduler_audit.jsonl
            data/audit/aigc_google_workspace_secret_manager_procurement_audit.jsonl
            data/audit/aigc_mvp_plus_plus_plus_procurement_audit.jsonl
            data/audit/aigc_access_automation_procurement_audit.jsonl
            data/audit/aigc_work_source_gate_procurement_audit.jsonl
            data/audit/aigc_auto_approval_gate_audit.jsonl
            data/audit/aigc_phase25_audit.jsonl
            data/audit/aigc_phase26_audit.jsonl
            data/audit/aigc_employer_deliverable_procurement_audit.jsonl
            data/audit/aigc_submission_approval_audit.jsonl
            reports/phase1_cognitive_router_report.md
            reports/phase2_24_continuity_report.md
            reports/phase_interleave_scheduler_report.md
            reports/google_workspace_secret_manager_procurement_report.md
            reports/mvp_plus_plus_plus_procurement_report.md
            reports/access_automation_procurement_report.md
            reports/work_source_gate_procurement_report.md
            reports/auto_approval_gate_procurement_report.md
            reports/phase25_constellation_fabric_report.md
            reports/phase26_constellation_refactor_report.md
            reports/employer_deliverable_procurement_report.md
            reports/submission_approval_cockpit.md
