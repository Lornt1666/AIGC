name: AIGC Runner Preflight - Verified Third-Party Action

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aigc-runner-preflight-verified-action.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aigc-runner-preflight-verified-action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified-third-party-action:
    name: verified-hashicorp-setup-terraform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Terraform with immutable verified action
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Prove verified third-party action execution
        shell: bash
        run: |
          set -euo pipefail
          echo "verified_third_party_action_executed=true"
          terraform version
