name: Secret-reference manifest validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "governance/secret-references*.json"
      - "governance/secret_references*.json"
      - "config/secret-references*.json"
      - "config/secret_references*.json"
      - "secrets/manifest*.json"
      - "governance/secret-references*.yml"
      - "governance/secret-references*.yaml"
      - "config/secret-references*.yml"
      - "config/secret-references*.yaml"
      - "scripts/validate_secret_manifest.py"
      - ".github/workflows/secret-manifest-validate.yml"
      - "SAFE_TESTS/test_secret_manifest_validator.py"

permissions:
  contents: read

concurrency:
  group: secret-reference-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate references without resolving values
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compile validator
        run: python3 -m py_compile scripts/validate_secret_manifest.py

      - name: Validate discovered manifests
        id: validation
        shell: bash
        run: |
          set +e
          python3 scripts/validate_secret_manifest.py --discover --require-manifest
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload sanitized validation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aigc-secret-reference-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/secret-manifest-validation/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce validation result
        if: always()
        shell: bash
        env:
          VALIDATION_EXIT_CODE: ${{ steps.validation.outputs.exit_code }}
        run: |
          if [[ "$VALIDATION_EXIT_CODE" != "0" ]]; then
            echo "Secret-reference validation failed with exit code: $VALIDATION_EXIT_CODE"
            exit "${VALIDATION_EXIT_CODE:-1}"
          fi
