name: AIGC Runner Preflight - GitHub Owned Action

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aigc-runner-preflight-github-owned.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aigc-runner-preflight-github-owned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-owned-action:
    name: github-owned-checkout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout with immutable GitHub-owned action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Prove GitHub-owned action execution
        shell: bash
        run: |
          set -euo pipefail
          echo "github_owned_action_executed=true"
          git rev-parse HEAD
