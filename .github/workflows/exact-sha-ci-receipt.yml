name: AIGC CI Exact-SHA Receipt

on:
  workflow_dispatch:
    inputs:
      request_commit_sha:
        description: Full commit SHA containing the non-secret request document
        required: true
        type: string
      request_id:
        description: Closed request identifier used to construct the request path
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: exact-sha-ci-${{ inputs.request_commit_sha }}-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  validate-exact-target:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout immutable broker revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable broker provenance
        working-directory: trusted
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_WORKFLOW_SHA}"
          test "${GITHUB_WORKFLOW_REF%%@*}" = "Lornt1666/AIGC/.github/workflows/exact-sha-ci-receipt.yml"

      - name: Validate inputs and extract request only
        id: request
        working-directory: trusted
        env:
          REQUEST_COMMIT_SHA: ${{ inputs.request_commit_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          [[ "$REQUEST_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^CI-RECEIPT-[A-Z0-9-]{8,80}$ ]]
          git fetch --no-tags origin "$REQUEST_COMMIT_SHA"
          git cat-file -e "$REQUEST_COMMIT_SHA^{commit}"
          git show "$REQUEST_COMMIT_SHA:ci/exact_sha_requests/${REQUEST_ID}.json" > /tmp/exact-sha-request.json
          result=$(python scripts/validate_exact_sha_ci_request.py --request /tmp/exact-sha-request.json --expected-broker-revision "$GITHUB_WORKFLOW_SHA")
          echo "target_sha=$(python -c 'import json,sys; print(json.load(sys.stdin)["target_sha"])' <<< "$result")" >> "$GITHUB_OUTPUT"

      - name: Verify target exists and is reachable from main
        working-directory: trusted
        run: |
          git fetch --no-tags origin main "${{ steps.request.outputs.target_sha }}"
          git cat-file -e "${{ steps.request.outputs.target_sha }}^{commit}"
          git merge-base --is-ancestor "${{ steps.request.outputs.target_sha }}" origin/main

      - name: Checkout exact requested target
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Install dependencies
        working-directory: target
        run: python -m pip install -r requirements.txt

      - name: Confirm exact checkout and tested tree
        id: checkout
        working-directory: target
        run: |
          observed=$(git rev-parse HEAD)
          test "$observed" = "${{ steps.request.outputs.target_sha }}"
          echo "observed_sha=$observed" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Execute shared canonical validation runner
        run: |
          mkdir -p "$RUNNER_TEMP/exact-sha-stage-results"
          python trusted/scripts/run_exact_sha_ci_contract.py \
            --contract trusted/config/exact_sha_ci_validation_contract.json \
            --project-root target \
            --results-dir "$RUNNER_TEMP/exact-sha-stage-results" \
            --repository-revision "${{ steps.request.outputs.target_sha }}" \
            --tested-tree-sha "${{ steps.checkout.outputs.tree_sha }}" \
            --broker-revision "$GITHUB_WORKFLOW_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-id "$GITHUB_RUN_ID"

      - name: Build trusted receipt bundle
        run: |
          python trusted/scripts/build_exact_sha_ci_receipt.py \
            --request /tmp/exact-sha-request.json \
            --requested-sha "${{ steps.request.outputs.target_sha }}" \
            --observed-sha "${{ steps.checkout.outputs.observed_sha }}" \
            --tree-sha "${{ steps.checkout.outputs.tree_sha }}" \
            --broker-revision "$GITHUB_WORKFLOW_SHA" \
            --contract trusted/config/exact_sha_ci_validation_contract.json \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-id "$GITHUB_RUN_ID" \
            --stage-results "$RUNNER_TEMP/exact-sha-stage-results" \
            --output-root "$RUNNER_TEMP/exact-sha-upload"

      - name: Verify exact final upload inventory
        run: python trusted/scripts/build_exact_sha_ci_receipt.py --output-root "$RUNNER_TEMP/exact-sha-upload" --verify-inventory

      - name: Upload exact-SHA receipt evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-sha-ci-receipt-${{ steps.request.outputs.target_sha }}
          path: ${{ runner.temp }}/exact-sha-upload
          if-no-files-found: error
