name: AIGC CI Exact-SHA Receipt

on:
  push:
    paths:
      - "ci/exact_sha_requests/*.json"

permissions:
  contents: read

concurrency:
  group: exact-sha-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-exact-target:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout request branch without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: request
          persist-credentials: false

      - name: Locate exactly one request
        id: locate
        shell: bash
        run: |
          mapfile -t files < <(find request/ci/exact_sha_requests -maxdepth 1 -type f -name '*.json' -print)
          test "${#files[@]}" -eq 1
          cp "${files[0]}" /tmp/exact-sha-request.json

      - name: Checkout trusted mainline broker code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Validate closed request and target reachability
        id: request
        shell: bash
        working-directory: trusted
        run: |
          result=$(python scripts/validate_exact_sha_ci_request.py --request /tmp/exact-sha-request.json)
          target=$(python -c 'import json,sys; print(json.load(sys.stdin)["target_sha"])' <<< "$result")
          git fetch --no-tags origin main "$target"
          git cat-file -e "$target^{commit}"
          git merge-base --is-ancestor "$target" origin/main
          echo "target_sha=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout exact requested target
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Confirm exact checkout and tree
        id: checkout
        shell: bash
        working-directory: target
        run: |
          observed=$(git rev-parse HEAD)
          test "$observed" = "${{ steps.request.outputs.target_sha }}"
          echo "observed_sha=$observed" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: target
        run: python -m pip install -r requirements.txt

      - name: Validate contracts
        working-directory: target
        run: python src/aigc.py validate

      - name: Scan committed content
        working-directory: target
        run: >
          python src/security/redaction_scanner.py
          --paths src scripts config docs governance README.md AGENTS.md AIGC_MASTER_PROMPT.md OMEGA_X_CONSTITUTION.md schemas tests reports Dockerfile render.yaml fly.toml Procfile

      - name: Validate inert Terraform
        shell: bash
        working-directory: target
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "aigc-offline-inert-plan-no-provider-action"
        run: |
          mkdir -p reports/artifacts/exact_sha_ci/terraform
          terraform -chdir=infra/terraform/gcp fmt -check -recursive
          terraform -chdir=infra/terraform/gcp init -backend=false -input=false
          terraform -chdir=infra/terraform/gcp validate
          terraform -chdir=infra/terraform/gcp plan -input=false -lock=false -refresh=false -var-file=staging.tfvars.example -out=/tmp/aigc-exact-sha.tfplan
          terraform -chdir=infra/terraform/gcp show -json /tmp/aigc-exact-sha.tfplan > reports/artifacts/exact_sha_ci/terraform/plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('reports/artifacts/exact_sha_ci/terraform/plan.json').read_text())
          if plan.get('resource_changes'): raise SystemExit('inert plan contains resource changes')
          PY

      - name: Run tests
        shell: bash
        working-directory: target
        run: |
          mkdir -p reports/artifacts/exact_sha_ci/tests
          set -o pipefail
          python -m pytest 2>&1 | tee reports/artifacts/exact_sha_ci/tests/pytest.log

      - name: Evaluate readiness
        working-directory: target
        run: python src/aigc.py readiness

      - name: Build immutable receipt and manifest
        shell: bash
        run: |
          mkdir -p target/reports/artifacts/exact_sha_ci/request
          cp /tmp/exact-sha-request.json target/reports/artifacts/exact_sha_ci/request/request.json
          python trusted/scripts/build_exact_sha_ci_receipt.py \
            --request /tmp/exact-sha-request.json \
            --requested-sha "${{ steps.request.outputs.target_sha }}" \
            --observed-sha "${{ steps.checkout.outputs.observed_sha }}" \
            --tree-sha "${{ steps.checkout.outputs.tree_sha }}" \
            --workflow-revision "${GITHUB_SHA}" \
            --run-number "${GITHUB_RUN_NUMBER}" \
            --run-id "${GITHUB_RUN_ID}" \
            --artifacts target/reports/artifacts/exact_sha_ci \
            --output target/reports/artifacts/exact_sha_ci/receipt/exact_sha_ci_receipt.json

      - name: Upload exact-SHA receipt evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-sha-ci-receipt-${{ steps.request.outputs.target_sha }}
          path: target/reports/artifacts/exact_sha_ci
          if-no-files-found: error
