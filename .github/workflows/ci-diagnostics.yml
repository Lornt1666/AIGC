name: CI diagnostics receipt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/ci_diagnostics.py"
      - ".github/workflows/ci-diagnostics.yml"
      - "scripts/validate_secret_manifest.py"
      - ".github/workflows/secret-manifest-validate.yml"
      - "scripts/run_controlled_gemini_canary_sandbox.py"
      - "docs/DEVPOST_SUBMISSION_TEMPLATE.md"
      - "tests/test_repository_evidence_controls.py"
      - "governance/secret-references*.json"

permissions:
  contents: read

concurrency:
  group: ci-diagnostics-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    name: Generate bounded diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Report interpreter
        run: python3 --version

      - name: Compile bounded update scripts and tests
        run: python3 -m compileall -q scripts tests/test_repository_evidence_controls.py

      - name: Run repository-native evidence-control tests
        run: python3 -m pytest -q tests/test_repository_evidence_controls.py

      - name: Generate diagnostics receipt
        id: diagnostics
        shell: bash
        run: |
          set +e
          python3 scripts/ci_diagnostics.py --strict
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostics receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aigc-ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce diagnostics result
        if: always()
        shell: bash
        env:
          DIAGNOSTICS_EXIT_CODE: ${{ steps.diagnostics.outputs.exit_code }}
        run: |
          if [[ "$DIAGNOSTICS_EXIT_CODE" != "0" ]]; then
            echo "Diagnostics strict gate failed with exit code: $DIAGNOSTICS_EXIT_CODE"
            exit "${DIAGNOSTICS_EXIT_CODE:-1}"
          fi
