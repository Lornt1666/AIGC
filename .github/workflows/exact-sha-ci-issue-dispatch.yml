name: AIGC CI Exact-SHA Issue Dispatch

on:
  issues:
    types:
      - opened
      - labeled

permissions:
  contents: read
  issues: write

concurrency:
  group: exact-sha-ci-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate-exact-target:
    if: contains(github.event.issue.labels.*.name, 'exact-sha-ci-request')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout immutable broker revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable broker provenance
        working-directory: trusted
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_WORKFLOW_SHA}"
          test "${GITHUB_WORKFLOW_REF%%@*}" = "Lornt1666/AIGC/.github/workflows/exact-sha-ci-issue-dispatch.yml"

      - name: Capture and validate governed issue request
        id: request
        working-directory: trusted
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}" > "$RUNNER_TEMP/issue-initial.json"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments?per_page=100" > "$RUNNER_TEMP/issue-comments.json"
          python scripts/validate_exact_sha_ci_issue_request.py validate \
            --event "$GITHUB_EVENT_PATH" \
            --issue "$RUNNER_TEMP/issue-initial.json" \
            --comments "$RUNNER_TEMP/issue-comments.json" \
            --expected-broker-revision "$GITHUB_WORKFLOW_SHA" \
            --output "$RUNNER_TEMP/issue-request-envelope.json" \
            > "$RUNNER_TEMP/issue-request-result.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          value = json.loads(root.joinpath("issue-request-envelope.json").read_text())
          print(f"target_sha={value['request']['target_sha']}")
          print(f"request_id={value['request']['request_id']}")
          print(f"execution_binding_sha256={value['binding']['execution_binding_sha256']}")
          root.joinpath("exact-sha-request.json").write_text(
              json.dumps(value["request"], sort_keys=True, separators=(",", ":")) + "\n"
          )
          PY

      - name: Reject global request-ID replay
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          CURRENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api search/issues \
            -f q="repo:${GITHUB_REPOSITORY} is:issue in:body \"${REQUEST_ID}\"" \
            > "$RUNNER_TEMP/request-id-search.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          current = int(os.environ["CURRENT_ISSUE"])
          root = Path(os.environ["RUNNER_TEMP"])
          value = json.loads(root.joinpath("request-id-search.json").read_text())
          others = [int(item["number"]) for item in value.get("items", []) if int(item["number"]) != current]
          if others:
              raise SystemExit(f"request_id already appears in issue(s): {others}")
          PY

      - name: Verify target exists and is reachable from main
        working-directory: trusted
        run: |
          git fetch --no-tags origin main "${{ steps.request.outputs.target_sha }}"
          git cat-file -e "${{ steps.request.outputs.target_sha }}^{commit}"
          git merge-base --is-ancestor "${{ steps.request.outputs.target_sha }}" origin/main

      - name: Checkout exact requested target
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Install dependencies
        working-directory: target
        run: python -m pip install -r requirements.txt

      - name: Confirm exact checkout and tested tree
        id: checkout
        working-directory: target
        run: |
          observed=$(git rev-parse HEAD)
          test "$observed" = "${{ steps.request.outputs.target_sha }}"
          echo "observed_sha=$observed" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Execute shared canonical validation runner
        run: |
          mkdir -p "$RUNNER_TEMP/exact-sha-stage-results"
          python trusted/scripts/run_exact_sha_ci_contract.py \
            --contract trusted/config/exact_sha_ci_validation_contract.json \
            --project-root target \
            --results-dir "$RUNNER_TEMP/exact-sha-stage-results" \
            --repository-revision "${{ steps.request.outputs.target_sha }}" \
            --tested-tree-sha "${{ steps.checkout.outputs.tree_sha }}" \
            --broker-revision "$GITHUB_WORKFLOW_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-id "$GITHUB_RUN_ID"

      - name: Revalidate issue before evidence finalization
        working-directory: trusted
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}" > "$RUNNER_TEMP/issue-current.json"
          python scripts/validate_exact_sha_ci_issue_request.py recheck \
            --issue "$RUNNER_TEMP/issue-current.json" \
            --envelope "$RUNNER_TEMP/issue-request-envelope.json"

      - name: Build trusted receipt bundle
        run: |
          python trusted/scripts/build_exact_sha_ci_receipt.py \
            --request "$RUNNER_TEMP/exact-sha-request.json" \
            --requested-sha "${{ steps.request.outputs.target_sha }}" \
            --observed-sha "${{ steps.checkout.outputs.observed_sha }}" \
            --tree-sha "${{ steps.checkout.outputs.tree_sha }}" \
            --broker-revision "$GITHUB_WORKFLOW_SHA" \
            --contract trusted/config/exact_sha_ci_validation_contract.json \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-id "$GITHUB_RUN_ID" \
            --stage-results "$RUNNER_TEMP/exact-sha-stage-results" \
            --execution-envelope "$RUNNER_TEMP/issue-request-envelope.json" \
            --output-root "$RUNNER_TEMP/exact-sha-upload"

      - name: Verify exact final upload inventory
        run: python trusted/scripts/build_exact_sha_ci_receipt.py --output-root "$RUNNER_TEMP/exact-sha-upload" --verify-inventory

      - name: Upload exact-SHA receipt evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-sha-ci-receipt-${{ steps.request.outputs.target_sha }}
          path: ${{ runner.temp }}/exact-sha-upload
          if-no-files-found: error

      - name: Revalidate issue before terminal mutation
        working-directory: trusted
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}" > "$RUNNER_TEMP/issue-terminal.json"
          python scripts/validate_exact_sha_ci_issue_request.py recheck \
            --issue "$RUNNER_TEMP/issue-terminal.json" \
            --envelope "$RUNNER_TEMP/issue-request-envelope.json"

      - name: Comment verified success and close request issue
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
          BINDING_SHA: ${{ steps.request.outputs.execution_binding_sha256 }}
        run: |
          body=$(cat <<EOF
          AIGC-EXACT-SHA-CI-COMPLETED request_id=${REQUEST_ID}

          - target_sha: \`${TARGET_SHA}\`
          - execution_binding_sha256: \`${BINDING_SHA}\`
          - run_id: \`${GITHUB_RUN_ID}\`
          - run_number: \`${GITHUB_RUN_NUMBER}\`
          - result: broker validation succeeded; artifact inventory verified
          - production_activation_authorized: false
          - external_action_performed: false
          EOF
          )
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Comment bounded failure
        if: failure()
        run: |
          body=$(cat <<EOF
          AIGC-EXACT-SHA-CI-FAILED

          - run_id: \`${GITHUB_RUN_ID}\`
          - run_number: \`${GITHUB_RUN_NUMBER}\`
          - classification: governed validation failed closed
          - issue_closed: false
          - production_activation_authorized: false
          - external_action_performed: false
          EOF
          )
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "$body" || true
