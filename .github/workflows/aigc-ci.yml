name: AIGC CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      requested_revision:
        description: "Exact commit SHA, branch, or tag to validate"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: aigc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: aigc
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aigc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aigc -d aigc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AIGC_COMMAND_CENTER_TEST_DATABASE_URL: postgresql://aigc@localhost:5432/aigc_test?sslmode=disable
      REQUESTED_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.requested_revision || github.sha }}
    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.REQUESTED_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact requested checkout
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          observed_head_sha="$(git rev-parse HEAD)"
          requested_revision="$REQUESTED_REVISION"
          # Dispatch may receive a branch/tag; compare immutable SHA after checkout.
          if [[ "$requested_revision" =~ ^[0-9a-fA-F]{40}$ ]] && [ "$observed_head_sha" != "$requested_revision" ]; then
            echo "Exact-head admission failed: requested SHA and observed revision differ." >&2
            exit 1
          fi
          echo "requested_revision=$requested_revision" >> "$GITHUB_OUTPUT"
          echo "requested_head_sha=$observed_head_sha" >> "$GITHUB_OUTPUT"
          echo "observed_head_sha=$observed_head_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Install and verify dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aigc-ci-stage-results"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-gemini.txt
          python -m pip check | tee "$RUNNER_TEMP/aigc-ci-stage-results/pip-check.log"

      - name: Resolve tested tree
        id: tested
        shell: bash
        run: echo "tree_sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Execute shared canonical validation runner
        run: |
          mkdir -p "$RUNNER_TEMP/aigc-ci-stage-results"
          python scripts/run_exact_sha_ci_contract.py \
            --contract config/exact_sha_ci_validation_contract.json \
            --project-root . \
            --results-dir "$RUNNER_TEMP/aigc-ci-stage-results" \
            --repository-revision "${{ steps.identity.outputs.observed_head_sha }}" \
            --tested-tree-sha "${{ steps.tested.outputs.tree_sha }}" \
            --broker-revision "${{ steps.identity.outputs.observed_head_sha }}" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-id "$GITHUB_RUN_ID"

      - name: Compile governed Gemini release
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/gemini_workflow \
            src/webapp/gemini_app.py \
            src/webapp/gemini_ui.py \
            scripts/deploy_gemini_staging.py \
            scripts/publish_gemini_judge_receipt.py \
            scripts/run_controlled_gemini_canary.py \
            scripts/run_gemini_workflow_smoke.py \
            scripts/validate_gemini_staging_authorization.py \
            scripts/run_focused_gemini_ci.py

      - name: Validate RegenExcalibur governed agent registry
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_regenexcalibur_agent_registry.py
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_regenexcalibur_agent_registry.py' -v

      - name: Run Governor Agent policy tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_aigc_governor.py' -v

      - name: Run Governor integration milestone gate tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_aigc_governor_milestones.py' -v

      - name: Run read-only CI validation agent tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_aigc_ci_validation_agent.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_aigc_ci_role_agents.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_aigc_required_acceptance_gate_agent.py' -v

      - name: Run OIDC identity verifier tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_aigc_oidc_identity.py' -v

      - name: Run control-plane agent unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_aigc_control_plane_agents.py' -v

      - name: Run real GitHub attestation adapter contract tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_aigc_gh_attestation_adapter.py' -v

      - name: Run fail-closed evidence verifier policy tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_aigc_release_evidence_verifier.py' -v

      - name: Scan release-only paths for secret-like content
        shell: bash
        run: |
          set -euo pipefail
          python src/security/redaction_scanner.py --paths \
            .gcloudignore.gemini Dockerfile.gemini cloudbuild.gemini.yaml \
            requirements-gemini.txt migrations/002_gemini_runtime_controls.sql \
            "product evidence" src/gemini_workflow src/webapp/gemini_app.py \
            src/webapp/gemini_ui.py scripts/deploy_gemini_staging.py \
            scripts/publish_gemini_judge_receipt.py scripts/run_controlled_gemini_canary.py \
            scripts/run_gemini_workflow_smoke.py scripts/validate_gemini_staging_authorization.py \
            scripts/run_focused_gemini_ci.py config/gemini_canary_intake.example.json \
            config/gemini_ci_receipt.example.json config/gemini_deployment_permit.example.json \
            config/gemini_judge_media_manifest.example.json config/gemini_live_assessment_permit.example.json \
            config/gemini_runtime_limits.json config/gemini_runtime_receipt.example.json \
            config/gemini_secret_access_manifest.json config/gemini_staging_authorization.example.json \
            docs/DEVPOST_GEMINI_WORKFLOW.md docs/DEVPOST_SUBMISSION_DRAFT.md \
            docs/GEMINI_COMPLETION_RUNBOOK.md docs/GEMINI_REQUIREMENTS_EVIDENCE_MATRIX.md

      - name: Run focused Gemini controls with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_focused_gemini_ci.py | tee "$RUNNER_TEMP/aigc-ci-stage-results/focused-gemini-pytest.log"

      - name: Run governed Gemini workflow offline smoke
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_gemini_workflow_smoke.py --output-dir "$RUNNER_TEMP/aigc-ci-stage-results/gemini_workflow_smoke"

      - name: Emit exact-head admission receipt
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aigc-ci-stage-results"
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "pr_number": int(os.environ.get("PR_NUMBER", "0")),
              "workflow_event": os.environ["GITHUB_EVENT_NAME"],
              "requested_revision": os.environ.get("REQUESTED_REVISION", ""),
              "requested_head_sha": os.environ.get("REQUESTED_HEAD_SHA", ""),
              "observed_head_sha": os.environ.get("OBSERVED_HEAD_SHA", ""),
              "tested_tree_sha": os.environ.get("TESTED_TREE_SHA", ""),
              "base_sha": os.environ.get("BASE_SHA", ""),
              "workflow_revision": os.environ.get("WORKFLOW_REVISION", ""),
              "workflow_run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "artifact_name": os.environ.get("ARTIFACT_NAME", ""),
              "captured_timestamp": datetime.now(timezone.utc).isoformat(),
              "external_authority_granted": False,
              "merge_authority_granted": False,
              "deployment_authority_granted": False,
              "live_model_call_authority_granted": False,
              "financial_authority_granted": False,
          }
          Path(os.environ["RUNNER_TEMP"], "aigc-ci-stage-results", "exact_head_admission_receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          REQUESTED_REVISION: ${{ env.REQUESTED_REVISION }}
          REQUESTED_HEAD_SHA: ${{ steps.identity.outputs.requested_head_sha }}
          OBSERVED_HEAD_SHA: ${{ steps.identity.outputs.observed_head_sha }}
          TESTED_TREE_SHA: ${{ steps.tested.outputs.tree_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          WORKFLOW_REVISION: ${{ github.workflow_sha || github.sha }}
          ARTIFACT_NAME: aigc-colosseum-orchestration-exact-head-${{ steps.identity.outputs.observed_head_sha }}

      - name: Upload canonical validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aigc-colosseum-orchestration-exact-head-${{ steps.identity.outputs.observed_head_sha }}
          path: ${{ runner.temp }}/aigc-ci-stage-results
          if-no-files-found: error
  revalidate_locked_releases:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: v0-12
            target_sha: 4af438408894c348ec766bfccc730b3a62a8f69d
          - label: v0-13
            target_sha: 119625b87bec93fb895d176023d47265eed8b9b9
    runs-on: ubuntu-latest
    steps:
      - name: Checkout locked target
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ matrix.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify locked target identity
        shell: bash
        run: |
          set -euo pipefail
          observed_head_sha="$(git rev-parse HEAD)"
          if [ "$observed_head_sha" != "${{ matrix.target_sha }}" ]; then
            echo "Locked-target admission failed." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run canonical validation against locked target
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aigc-locked-${{ matrix.label }}"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          python scripts/run_exact_sha_ci_contract.py \
            --contract config/exact_sha_ci_validation_contract.json \
            --project-root . \
            --results-dir "$RUNNER_TEMP/aigc-locked-${{ matrix.label }}" \
            --repository-revision "${{ matrix.target_sha }}" \
            --tested-tree-sha "$tree_sha" \
            --broker-revision "${{ matrix.target_sha }}" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-id "$GITHUB_RUN_ID"

      - name: Upload locked-target evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aigc-locked-validation-${{ matrix.label }}-${{ matrix.target_sha }}
          path: ${{ runner.temp }}/aigc-locked-${{ matrix.label }}
          if-no-files-found: error

  attest_main_evidence:
    # Never mint provenance for an untrusted pull-request revision. This job runs
    # only for a successful push to protected main, after the entire validate job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success'
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install OIDC verifier dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'PyJWT[crypto]==2.10.1'

      - name: Verify actual GitHub OIDC token and exact trust claims
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/verify_github_actions_oidc_claims.py > "$RUNNER_TEMP/oidc-verification.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads(Path(os.environ["RUNNER_TEMP"], "oidc-verification.json").read_text())
          assert value.get("status") == "VERIFIED"
          assert value.get("source_sha") == os.environ["GITHUB_SHA"]
          assert value.get("token_emitted") is False
          PY

      - name: Download exact-head canonical validation evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: aigc-colosseum-orchestration-exact-head-${{ github.sha }}
          path: ${{ runner.temp }}/aigc-attestation-input

      - name: Package evidence deterministically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aigc-release-assurance"
          cp "$RUNNER_TEMP/oidc-verification.json" "$RUNNER_TEMP/aigc-release-assurance/"
          cd "$RUNNER_TEMP/aigc-attestation-input"
          zip -X -r "$RUNNER_TEMP/aigc-release-assurance/evidence.zip" .

      - name: Install pinned GitHub CLI and verify its digest
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh_2.102.1_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/cli/cli/releases/download/v2.102.1/gh_2.102.1_linux_amd64.tar.gz \
            --output "$archive"
          echo "77b9e297e94c50336823d0f84de7ef1be60cba704601fa0d98f129f47a94987b  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gh"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gh" --strip-components=1
          "$RUNNER_TEMP/gh/bin/gh" --version | head -n 1 | grep -F "2.102.1"

      - name: Generate GitHub/Sigstore provenance for evidence package
        id: attest
        uses: actions/attest@7a37fbbab9669658a566371acd1cf2f8c7a40d32
        with:
          subject-path: ${{ runner.temp }}/aigc-release-assurance/evidence.zip
          show-summary: true

      - name: Cryptographically verify exact evidence package provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/verify_aigc_gh_attestation.py \
            --gh "$RUNNER_TEMP/gh/bin/gh" \
            --artifact "$RUNNER_TEMP/aigc-release-assurance/evidence.zip" \
            --repository Lornt1666/AIGC \
            --signer-workflow Lornt1666/AIGC/.github/workflows/aigc-ci.yml \
            --source-sha "$GITHUB_SHA" \
            --expected-predicate "https://slsa.dev/provenance/v1" \
            --output "$RUNNER_TEMP/aigc-release-assurance/attestation-receipt.json" \
            --raw-output "$RUNNER_TEMP/aigc-release-assurance/attestation-verification.json" \
            > "$RUNNER_TEMP/aigc-release-assurance/attestation-adapter-summary.json"
          test -s "$RUNNER_TEMP/aigc-release-assurance/attestation-receipt.json"
          test -s "$RUNNER_TEMP/aigc-release-assurance/attestation-verification.json"
          test -s "$RUNNER_TEMP/aigc-release-assurance/attestation-adapter-summary.json"

      - name: Upload verified provenance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aigc-signed-main-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/aigc-release-assurance/
          if-no-files-found: error
