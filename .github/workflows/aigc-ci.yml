name: AIGC CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aigc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REQUESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.REQUESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact checkout and tested tree
        id: tested
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aigc-ci-stage-results"
          requested="$REQUESTED_SHA"
          observed="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"

          if [[ ! "$requested" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Requested revision is not a full commit SHA." >&2
            exit 1
          fi
          if [[ "$observed" != "$requested" ]]; then
            echo "Exact-head checkout mismatch: requested=$requested observed=$observed" >&2
            exit 1
          fi

          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'event_name=%s\n' "$GITHUB_EVENT_NAME"
            printf 'workflow_name=%s\n' "$GITHUB_WORKFLOW"
            printf 'run_number=%s\n' "$GITHUB_RUN_NUMBER"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'requested_sha=%s\n' "$requested"
            printf 'observed_sha=%s\n' "$observed"
            printf 'tested_tree_sha=%s\n' "$tree_sha"
            printf 'workflow_sha=%s\n' "$GITHUB_WORKFLOW_SHA"
            printf 'production_activation_authorized=false\n'
            printf 'external_action_authorized=false\n'
            printf 'gmail_send_authorized=false\n'
            printf 'github_runtime_mutation_authorized=false\n'
          } > "$RUNNER_TEMP/aigc-ci-stage-results/exact-head-binding.txt"

          echo "requested_sha=$requested" >> "$GITHUB_OUTPUT"
          echo "observed_sha=$observed" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$tree_sha" >> "$GITHUB_OUTPUT"

      - name: Validate pull-request diff
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --check "${BASE_SHA}...HEAD"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-gemini.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Install and verify dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-gemini.txt
          python -m pip check | tee "$RUNNER_TEMP/aigc-ci-stage-results/pip-check.log"

      - name: Compile governed Gemini release
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/gemini_workflow \
            src/webapp/gemini_app.py \
            src/webapp/gemini_ui.py \
            scripts/deploy_gemini_staging.py \
            scripts/publish_gemini_judge_receipt.py \
            scripts/run_controlled_gemini_canary.py \
            scripts/run_gemini_workflow_smoke.py \
            scripts/validate_gemini_staging_authorization.py
          printf 'python_compile=passed\n' \
            > "$RUNNER_TEMP/aigc-ci-stage-results/gemini-compile.log"

      - name: Execute shared canonical validation runner
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_exact_sha_ci_contract.py \
            --contract config/exact_sha_ci_validation_contract.json \
            --project-root . \
            --results-dir "$RUNNER_TEMP/aigc-ci-stage-results" \
            --repository-revision "${{ steps.tested.outputs.observed_sha }}" \
            --tested-tree-sha "${{ steps.tested.outputs.tree_sha }}" \
            --broker-revision "$GITHUB_WORKFLOW_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-id "$GITHUB_RUN_ID"

      - name: Scan release-only paths for secret-like content
        shell: bash
        run: |
          set -euo pipefail
          python src/security/redaction_scanner.py --paths \
            .gcloudignore.gemini \
            Dockerfile.gemini \
            cloudbuild.gemini.yaml \
            requirements-gemini.txt \
            migrations/002_gemini_runtime_controls.sql \
            "product evidence" \
            src/gemini_workflow \
            src/webapp/gemini_app.py \
            src/webapp/gemini_ui.py \
            scripts/deploy_gemini_staging.py \
            scripts/publish_gemini_judge_receipt.py \
            scripts/run_controlled_gemini_canary.py \
            scripts/run_gemini_workflow_smoke.py \
            scripts/validate_gemini_staging_authorization.py \
            config/gemini_canary_intake.example.json \
            config/gemini_ci_receipt.example.json \
            config/gemini_deployment_permit.example.json \
            config/gemini_judge_media_manifest.example.json \
            config/gemini_live_assessment_permit.example.json \
            config/gemini_runtime_limits.json \
            config/gemini_runtime_receipt.example.json \
            config/gemini_secret_access_manifest.json \
            config/gemini_staging_authorization.example.json \
            docs/DEVPOST_GEMINI_WORKFLOW.md \
            docs/DEVPOST_SUBMISSION_DRAFT.md \
            docs/GEMINI_COMPLETION_RUNBOOK.md \
            docs/GEMINI_REQUIREMENTS_EVIDENCE_MATRIX.md

      - name: Run focused Gemini controls with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -W error \
            tests/test_controlled_gemini_canary.py \
            tests/test_gcs_evidence_receipts.py \
            tests/test_gemini_controls.py \
            tests/test_gemini_image_allowlist.py \
            tests/test_gemini_readiness.py \
            tests/test_gemini_receipt_binding.py \
            tests/test_gemini_staging_authorization.py \
            tests/test_gemini_staging_deploy.py \
            tests/test_gemini_surfaces.py \
            tests/test_gemini_ui.py \
            tests/test_gemini_workflow.py \
            tests/test_judge_receipts.py \
            tests/test_judge_store.py \
            tests/test_publish_gemini_judge_receipt.py \
            tests/test_secret_broker.py \
            | tee "$RUNNER_TEMP/aigc-ci-stage-results/focused-gemini-pytest.log"

      - name: Run governed Gemini workflow offline smoke
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_gemini_workflow_smoke.py \
            --output-dir "$RUNNER_TEMP/aigc-ci-stage-results/gemini_workflow_smoke"

      - name: Upload canonical exact-head validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-aigc-ci-${{ env.REQUESTED_SHA }}
          path: ${{ runner.temp }}/aigc-ci-stage-results
          if-no-files-found: error
