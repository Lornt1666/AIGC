name: AIGC CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate contracts
        run: python src/aigc.py validate

      - name: Validate AEC-001 constitutional substrate
        run: python src/validate_aec_001.py

      - name: Scan committed content for secret-like content
        run: >
          python src/security/redaction_scanner.py
          --paths src config docs governance README.md AGENTS.md AIGC_MASTER_PROMPT.md OMEGA_X_CONSTITUTION.md schemas tests reports Dockerfile render.yaml fly.toml Procfile

      - name: Run procurement smoke stages
        run: |
          python src/save_credential_broker_procurement.py --project-root . --config config/aigc_save_credential_broker.json
          python src/n8n_workflow_dispatch_bridge_procurement.py --project-root . --config config/aigc_n8n_workflow_dispatch_bridge.json
          python src/aigc.py validate --schema save_credential_broker_packet --path data/save_credential_broker/aigc_save_credential_broker_packet.json
          python src/aigc.py validate --schema n8n_workflow_dispatch_bridge_packet --path data/n8n_bridge/aigc_n8n_workflow_dispatch_bridge_packet.json

      - name: Validate CI dependency manifest contract
        run: >
          python -m pytest tests/test_ci_action_pinning.py::test_ci_action_dependency_manifest_matches_contract
          tests/test_ci_action_pinning.py::test_ci_action_manifest_is_unique_and_review_gated -q

      - name: Validate immutable action references
        run: >
          python -m pytest tests/test_ci_action_pinning.py::test_all_workflow_actions_use_full_immutable_commit_shas -q

      - name: Validate action references against manifest
        run: >
          python -m pytest tests/test_ci_action_pinning.py::test_all_workflow_actions_match_the_dependency_manifest -q

      - name: Validate dependency manifest negative cases
        run: >
          python -m pytest tests/test_ci_action_pinning.py::test_manifest_contract_rejects_automatic_merge
          tests/test_ci_action_pinning.py::test_manifest_contract_rejects_mutable_action_revision -q

      - name: Run tests
        run: python -m pytest

      - name: Evaluate production readiness evidence
        run: python src/aigc.py readiness

      - name: Upload production readiness receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-readiness-${{ github.sha }}
          path: reports/artifacts/production_readiness
          if-no-files-found: warn
