name: AIGC CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aigc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # setup-terraform 4.0.1
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-gemini.txt

      - name: Validate contracts
        run: python src/aigc.py validate

      - name: Validate provider discovery kit contracts
        run: |
          python src/aigc.py validate --schema provider_discovery_command_catalog --path config/provider_discovery_command_catalog.json
          python src/aigc.py validate --schema provider_discovery_mock_fixture --path config/provider_discovery_mock_fixture.json

      - name: Validate AEC-001 constitutional substrate
        run: python src/validate_aec_001.py

      - name: Scan committed content for secret-like content
        run: >
          python src/security/redaction_scanner.py
          --paths src scripts config docs governance "product evidence" README.md AGENTS.md AIGC_MASTER_PROMPT.md OMEGA_X_CONSTITUTION.md schemas tests reports Dockerfile .dockerignore render.yaml fly.toml Procfile

      - name: Run procurement smoke stages
        run: |
          python src/save_credential_broker_procurement.py --project-root . --config config/aigc_save_credential_broker.json
          python src/n8n_workflow_dispatch_bridge_procurement.py --project-root . --config config/aigc_n8n_workflow_dispatch_bridge.json
          python src/aigc.py validate --schema save_credential_broker_packet --path data/save_credential_broker/aigc_save_credential_broker_packet.json
          python src/aigc.py validate --schema n8n_workflow_dispatch_bridge_packet --path data/n8n_bridge/aigc_n8n_workflow_dispatch_bridge_packet.json

      - name: Run provider discovery mock-only smoke
        run: |
          python scripts/run_provider_discovery_mock.py \
            --repository-revision "${GITHUB_SHA}" \
            --created-at "2026-07-15T00:00:00Z" \
            --output-dir reports/artifacts/provider_discovery_simulation

      - name: Upload provider discovery simulation
        uses: actions/upload-artifact@v4
        with:
          name: provider-discovery-simulation-${{ github.sha }}
          path: reports/artifacts/provider_discovery_simulation
          if-no-files-found: error

      - name: Run governed Gemini workflow offline smoke
        run: |
          python scripts/run_gemini_workflow_smoke.py \
            --output-dir reports/artifacts/gemini_workflow_smoke

      - name: Upload governed Gemini workflow smoke
        uses: actions/upload-artifact@v4
        with:
          name: gemini-workflow-offline-smoke-${{ github.sha }}
          path: reports/artifacts/gemini_workflow_smoke
          if-no-files-found: error

      - name: Validate inert Terraform staging foundation
        shell: bash
        env:
          # Non-secret placeholder used only to prevent ADC lookup in a zero-resource,
          # refresh-disabled plan. The plan is asserted to contain no resources.
          GOOGLE_OAUTH_ACCESS_TOKEN: "aigc-offline-inert-plan-no-provider-action"
        run: |
          set -o pipefail
          mkdir -p reports/artifacts/terraform_validation
          {
            terraform -chdir=infra/terraform/gcp fmt -check -recursive
            terraform -chdir=infra/terraform/gcp init -backend=false -input=false
            cp infra/terraform/gcp/.terraform.lock.hcl \
              reports/artifacts/terraform_validation/terraform.lock.hcl
            terraform -chdir=infra/terraform/gcp validate
            terraform -chdir=infra/terraform/gcp plan \
              -input=false \
              -lock=false \
              -refresh=false \
              -var-file=staging.tfvars.example \
              -out=/tmp/aigc-staging-inert.tfplan
            terraform -chdir=infra/terraform/gcp show -json \
              /tmp/aigc-staging-inert.tfplan \
              > reports/artifacts/terraform_validation/inert-plan.json
            python - <<'PY'
          import json
          from pathlib import Path

          plan_path = Path("reports/artifacts/terraform_validation/inert-plan.json")
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          resources = plan.get("resource_changes") or []
          if resources:
              addresses = [str(item.get("address")) for item in resources]
              raise SystemExit(
                  "Inert Terraform plan unexpectedly contains resource changes: "
                  + ", ".join(addresses)
              )
          Path("reports/artifacts/terraform_validation/inert-plan-summary.json").write_text(
              json.dumps(
                  {
                      "resource_change_count": 0,
                      "provider_action_performed": False,
                      "terraform_apply_performed": False,
                      "external_action_performed": False,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          } 2>&1 | tee reports/artifacts/terraform_validation/terraform-validation.log

      - name: Upload Terraform validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-validation-${{ github.sha }}
          path: reports/artifacts/terraform_validation
          if-no-files-found: error

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/artifacts/test_results
          python -m pytest 2>&1 | tee reports/artifacts/test_results/pytest.log

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: reports/artifacts/test_results
          if-no-files-found: error

      - name: Evaluate production readiness evidence
        run: python src/aigc.py readiness

      - name: Upload production readiness receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-${{ github.sha }}
          path: reports/artifacts/production_readiness
          if-no-files-found: warn
