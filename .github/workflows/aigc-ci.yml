name: AIGC CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      REQUESTED_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.REQUESTED_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact requested checkout
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          observed_head_sha="$(git rev-parse HEAD)"
          requested_head_sha="$REQUESTED_REVISION"
          if [ "$observed_head_sha" != "$requested_head_sha" ]; then
            echo "Exact-head admission failed: requested and observed revisions differ." >&2
            exit 1
          fi
          echo "requested_head_sha=$requested_head_sha" >> "$GITHUB_OUTPUT"
          echo "observed_head_sha=$observed_head_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve tested tree
        id: tested
        shell: bash
        run: echo "tree_sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Execute shared canonical validation runner
        run: |
          mkdir -p "$RUNNER_TEMP/aigc-ci-stage-results"
          python scripts/run_exact_sha_ci_contract.py \
            --contract config/exact_sha_ci_validation_contract.json \
            --project-root . \
            --results-dir "$RUNNER_TEMP/aigc-ci-stage-results" \
            --repository-revision "${{ steps.identity.outputs.observed_head_sha }}" \
            --tested-tree-sha "${{ steps.tested.outputs.tree_sha }}" \
            --broker-revision "${{ steps.identity.outputs.observed_head_sha }}" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-id "$GITHUB_RUN_ID"

      - name: Generate Nexus repository intelligence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aigc-ci-stage-results"
          python scripts/nexus_repository_intelligence.py \
            --root . \
            --output "$RUNNER_TEMP/aigc-ci-stage-results/nexus_repository_intelligence.json"

      - name: Emit exact-head admission receipt
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aigc-ci-stage-results"
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "pr_number": int(os.environ.get("PR_NUMBER", "0")),
              "workflow_event": os.environ["GITHUB_EVENT_NAME"],
              "requested_head_sha": os.environ.get("REQUESTED_HEAD_SHA", ""),
              "observed_head_sha": os.environ.get("OBSERVED_HEAD_SHA", ""),
              "tested_tree_sha": os.environ.get("TESTED_TREE_SHA", ""),
              "base_sha": os.environ.get("BASE_SHA", ""),
              "workflow_run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "artifact_name": os.environ.get("ARTIFACT_NAME", ""),
              "captured_timestamp": datetime.now(timezone.utc).isoformat(),
              "external_authority_granted": False,
              "merge_authority_granted": False,
              "deployment_authority_granted": False,
              "live_model_call_authority_granted": False,
              "financial_authority_granted": False,
          }
          Path(os.environ["RUNNER_TEMP"], "aigc-ci-stage-results", "exact_head_admission_receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          REQUESTED_HEAD_SHA: ${{ steps.identity.outputs.requested_head_sha }}
          OBSERVED_HEAD_SHA: ${{ steps.identity.outputs.observed_head_sha }}
          TESTED_TREE_SHA: ${{ steps.tested.outputs.tree_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          ARTIFACT_NAME: aigc-colosseum-foundation-exact-head-${{ env.REQUESTED_REVISION }}

      - name: Upload canonical validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aigc-colosseum-foundation-exact-head-${{ env.REQUESTED_REVISION }}
          path: ${{ runner.temp }}/aigc-ci-stage-results
          if-no-files-found: error
