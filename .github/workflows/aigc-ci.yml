name: AIGC CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aigc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REQUESTED_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.REQUESTED_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact requested checkout and tested tree
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aigc-ci-stage-results"
          requested_head_sha="$REQUESTED_REVISION"
          observed_head_sha="$(git rev-parse HEAD)"
          tested_tree_sha="$(git rev-parse 'HEAD^{tree}')"
          if [[ ! "$requested_head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Requested revision is not a full commit SHA." >&2
            exit 1
          fi
          if [ "$observed_head_sha" != "$requested_head_sha" ]; then
            echo "Exact-head admission failed: requested=$requested_head_sha observed=$observed_head_sha" >&2
            exit 1
          fi
          echo "requested_head_sha=$requested_head_sha" >> "$GITHUB_OUTPUT"
          echo "observed_head_sha=$observed_head_sha" >> "$GITHUB_OUTPUT"
          echo "tested_tree_sha=$tested_tree_sha" >> "$GITHUB_OUTPUT"
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'event_name=%s\n' "$GITHUB_EVENT_NAME"
            printf 'workflow_name=%s\n' "$GITHUB_WORKFLOW"
            printf 'run_number=%s\n' "$GITHUB_RUN_NUMBER"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'requested_head_sha=%s\n' "$requested_head_sha"
            printf 'observed_head_sha=%s\n' "$observed_head_sha"
            printf 'tested_tree_sha=%s\n' "$tested_tree_sha"
            printf 'production_activation_authorized=false\n'
            printf 'external_action_authorized=false\n'
            printf 'gmail_send_authorized=false\n'
            printf 'github_runtime_mutation_authorized=false\n'
            printf 'deployment_authorized=false\n'
            printf 'live_model_call_authorized=false\n'
            printf 'financial_action_authorized=false\n'
            printf 'merge_authorized=false\n'
          } > "$RUNNER_TEMP/aigc-ci-stage-results/exact-head-binding.txt"

      - name: Validate pull-request diff
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --check "${BASE_SHA}...HEAD"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-gemini.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Install and verify dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-gemini.txt
          python -m pip check | tee "$RUNNER_TEMP/aigc-ci-stage-results/pip-check.log"

      - name: Compile governed Gemini release
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/gemini_workflow \
            src/webapp/gemini_app.py \
            src/webapp/gemini_ui.py \
            scripts/deploy_gemini_staging.py \
            scripts/publish_gemini_judge_receipt.py \
            scripts/run_controlled_gemini_canary.py \
            scripts/run_gemini_workflow_smoke.py \
            scripts/validate_gemini_staging_authorization.py
          printf 'python_compile=passed\n' > "$RUNNER_TEMP/aigc-ci-stage-results/gemini-compile.log"

      - name: Execute shared canonical validation runner
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_exact_sha_ci_contract.py \
            --contract config/exact_sha_ci_validation_contract.json \
            --project-root . \
            --results-dir "$RUNNER_TEMP/aigc-ci-stage-results" \
            --repository-revision "${{ steps.identity.outputs.observed_head_sha }}" \
            --tested-tree-sha "${{ steps.identity.outputs.tested_tree_sha }}" \
            --broker-revision "${{ steps.identity.outputs.observed_head_sha }}" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-id "$GITHUB_RUN_ID"

      - name: Scan release-only paths for secret-like content
        shell: bash
        run: |
          set -euo pipefail
          python src/security/redaction_scanner.py --paths \
            .gcloudignore.gemini \
            Dockerfile.gemini \
            cloudbuild.gemini.yaml \
            requirements-gemini.txt \
            migrations/002_gemini_runtime_controls.sql \
            "product evidence" \
            src/gemini_workflow \
            src/webapp/gemini_app.py \
            src/webapp/gemini_ui.py \
            scripts/deploy_gemini_staging.py \
            scripts/publish_gemini_judge_receipt.py \
            scripts/run_controlled_gemini_canary.py \
            scripts/run_gemini_workflow_smoke.py \
            scripts/validate_gemini_staging_authorization.py \
            config/gemini_canary_intake.example.json \
            config/gemini_ci_receipt.example.json \
            config/gemini_deployment_permit.example.json \
            config/gemini_judge_media_manifest.example.json \
            config/gemini_live_assessment_permit.example.json \
            config/gemini_runtime_limits.json \
            config/gemini_runtime_receipt.example.json \
            config/gemini_secret_access_manifest.json \
            config/gemini_staging_authorization.example.json \
            docs/DEVPOST_GEMINI_WORKFLOW.md \
            docs/DEVPOST_SUBMISSION_DRAFT.md \
            docs/GEMINI_COMPLETION_RUNBOOK.md \
            docs/GEMINI_REQUIREMENTS_EVIDENCE_MATRIX.md

      - name: Run focused Gemini controls with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -W error \
            tests/test_controlled_gemini_canary.py \
            tests/test_gcs_evidence_receipts.py \
            tests/test_gemini_controls.py \
            tests/test_gemini_image_allowlist.py \
            tests/test_gemini_readiness.py \
            tests/test_gemini_receipt_binding.py \
            tests/test_gemini_staging_authorization.py \
            tests/test_gemini_staging_deploy.py \
            tests/test_gemini_surfaces.py \
            tests/test_gemini_ui.py \
            tests/test_gemini_workflow.py \
            tests/test_judge_receipts.py \
            tests/test_judge_store.py \
            tests/test_publish_gemini_judge_receipt.py \
            tests/test_secret_broker.py \
            | tee "$RUNNER_TEMP/aigc-ci-stage-results/focused-gemini-pytest.log"

      - name: Run governed Gemini workflow offline smoke
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_gemini_workflow_smoke.py \
            --output-dir "$RUNNER_TEMP/aigc-ci-stage-results/gemini_workflow_smoke"

      - name: Emit exact-head admission receipt
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aigc-ci-stage-results"
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "pr_number": int(os.environ.get("PR_NUMBER", "0")),
              "workflow_event": os.environ["GITHUB_EVENT_NAME"],
              "requested_head_sha": os.environ.get("REQUESTED_HEAD_SHA", ""),
              "observed_head_sha": os.environ.get("OBSERVED_HEAD_SHA", ""),
              "tested_tree_sha": os.environ.get("TESTED_TREE_SHA", ""),
              "base_sha": os.environ.get("BASE_SHA", ""),
              "workflow_run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "artifact_name": os.environ.get("ARTIFACT_NAME", ""),
              "captured_timestamp": datetime.now(timezone.utc).isoformat(),
              "external_authority_granted": False,
              "cloud_resource_creation_authority_granted": False,
              "deployment_authority_granted": False,
              "production_activation_authority_granted": False,
              "public_access_authority_granted": False,
              "live_model_call_authority_granted": False,
              "financial_authority_granted": False,
              "automatic_merge_authority_granted": False,
              "merge_authority_granted": False,
              "app_store_submission_authority_granted": False,
              "devpost_submission_authority_granted": False,
          }
          Path(os.environ["RUNNER_TEMP"], "aigc-ci-stage-results", "exact_head_admission_receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          REQUESTED_HEAD_SHA: ${{ steps.identity.outputs.requested_head_sha }}
          OBSERVED_HEAD_SHA: ${{ steps.identity.outputs.observed_head_sha }}
          TESTED_TREE_SHA: ${{ steps.identity.outputs.tested_tree_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          ARTIFACT_NAME: aigc-gemini-xprize-exact-head-${{ env.REQUESTED_REVISION }}

      - name: Upload canonical exact-head validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aigc-gemini-xprize-exact-head-${{ env.REQUESTED_REVISION }}
          path: ${{ runner.temp }}/aigc-ci-stage-results
          if-no-files-found: error
